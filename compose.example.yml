# One container syncs all vaults. Never run a second vaultsync (or any other git process) on the
# same vault folders. Mount the same host paths the Hermes containers use.
services:
  vaultsync:
    build: .
    restart: unless-stopped
    # Commit messages include the hostname; without this it is a random container id.
    hostname: nas-docker
    # uid:gid that owns the vault files on the NAS share (check with `ls -ln` on the docker host).
    user: "1026:100"
    environment:
      VAULT_PATH: /vaults/Werk:/vaults/Prive:/vaults/Project:/vaults/Archief
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GIT_AUTHOR_NAME: vaultsync-nas
      GIT_AUTHOR_EMAIL: vaultsync-nas@localhost
      GIT_COMMITTER_NAME: vaultsync-nas
      GIT_COMMITTER_EMAIL: vaultsync-nas@localhost
    volumes:
      - /mnt/nas/obsidian/Werk:/vaults/Werk
      - /mnt/nas/obsidian/Prive:/vaults/Prive
      - /mnt/nas/obsidian/Project:/vaults/Project
      - /mnt/nas/obsidian/Archief:/vaults/Archief
